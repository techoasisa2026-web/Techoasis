<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="打造科技綠洲，邀請小水滴們，來這個好吃好玩好所在，充電再出發！蔡岳儒「科技綠洲・洋流港灣」：北港、水林、口湖拼成一座島。">
<meta property="og:title" content="科技綠洲・洋流港灣｜蔡岳儒">
<meta property="og:description" content="打造科技綠洲，邀請小水滴們，來這個好吃好玩好所在，充電再出發！">
<title>科技綠洲洋流港灣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D island; brand + tools float top-left, policy index docks right (bottom sheet on phones), detail card opens left */
:root{
 --oasis:#14713c; --oasis-2:#1f9d55; --lagoon:#2b8fc9; --sand:#ecd9a8;
 --kouhu:#3d8fd8; --shuilin:#e9a02f; --beigang:#d36aa8;
 --p1:#c99512; --p2:#3a6fb8; --p3:#c2486a; --p4:#7a5cb0;
 --panel:#fbfcf7; --panel-2:#f0f5ec; --ink:#16261c; --ink-2:#4a5a4f; --mute:#7b887f; --line:#dbe5d8; --chip:#e8f1e5; --shadow:rgba(18,48,30,.16);
 --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:#16201a;--panel-2:#1c2a21;--ink:#e9f2ea;--ink-2:#b9c9bd;--mute:#8ea295;--line:#2b3c31;--chip:#243429;--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--panel:#16201a;--panel-2:#1c2a21;--ink:#e9f2ea;--ink-2:#b9c9bd;--mute:#8ea295;--line:#2b3c31;--chip:#243429;--shadow:rgba(0,0,0,.45);color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#9fd3ee;color:var(--ink);font-family:var(--f-body);overflow:hidden;margin:0}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform}
.lbl.town{font-family:var(--f-display);font-size:22px;color:#fff;padding:4px 14px 5px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);letter-spacing:.08em}
.lbl.town small{font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.92;margin-left:6px;letter-spacing:.02em}
.lbl.pin{display:flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px 3px 3px;border-radius:999px;box-shadow:0 3px 10px var(--shadow);border:1px solid var(--line)}
.lbl.pin b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-family:var(--f-mono);font-size:11px}
.lbl.pin.hot{outline:3px solid currentColor;animation:pop .6s ease}
.lbl.pin.dim{opacity:.0;pointer-events:none}
.lbl.pin.mini{padding:2px;gap:0}.lbl.pin.mini .tx{display:none}.lbl.pin.mini:hover{padding:3px 10px 3px 3px;gap:6px;z-index:2}.lbl.pin.mini:hover .tx{display:inline}
.lbl.vil{font-size:10px;font-weight:700;color:#24402d;background:rgba(255,255,255,.72);padding:1px 6px;border-radius:6px;pointer-events:none;transform:translate(-50%,-50%)}
.lbl.place{font-size:12px;font-weight:900;color:#fff;background:#0f5a32;padding:3px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.6)}60%{transform:translate(-50%,-100%) scale(1.12)}}
.lbl[hidden]{display:none!important}

.float{position:fixed;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px var(--shadow)}
#brand{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:14px 18px 14px;display:flex;gap:14px;align-items:center;max-width:min(460px,calc(100vw - 32px))}
#brand .mark{font-family:var(--f-display);font-size:40px;line-height:.95;color:var(--oasis);letter-spacing:.02em}
#brand .mark span{display:block;font-size:17px;color:var(--ink-2);letter-spacing:.32em;margin-top:6px}
#brand .who{border-left:2px solid var(--line);padding-left:14px;display:grid;gap:3px}
#brand .who b{font-size:34px;font-weight:900;line-height:1.05;letter-spacing:.06em;color:var(--oasis)}
#brand .who em{font-style:normal;font-size:12px;color:var(--ink-2)}
#brand .who i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--oasis-2);letter-spacing:.06em}
#tools{top:calc(118px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.seg{display:flex;padding:4px;gap:2px;border-radius:14px}
.seg button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:1px;min-width:44px;padding:6px 8px;border-radius:10px;font-size:11px;color:var(--ink-2);font-weight:700}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--oasis);color:#fff}
.seg button:focus-visible,.row:focus-visible,.item:focus-visible,.btn:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

#index{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(360px,34vw);display:flex;flex-direction:column;overflow:hidden}
#index header{padding:18px 20px 10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--oasis-2);text-transform:uppercase}
#index h1{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.2;margin:6px 0 8px;text-wrap:balance}
#index p.lead{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.facts div{background:var(--panel-2);border-radius:10px;padding:7px 8px;font-size:11px;color:var(--ink-2);line-height:1.35}
.facts b{display:block;font-family:var(--f-mono);font-size:17px;color:var(--oasis);font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 20px 10px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:9px 0;border-radius:11px;border:1px solid var(--line);font-weight:900;font-size:13px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#search{margin:0 20px 10px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px}
#list{overflow:auto;padding:0 12px 12px;display:grid;gap:4px;align-content:start;flex:1;min-height:0}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:11px 10px;border-radius:12px}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{background:var(--chip)}
.row .no{font-family:var(--f-display);font-size:26px;line-height:1}
.row .nm{font-weight:900;font-size:15px}
.row .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--mute);margin-top:2px}
.row .ct{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.sub{display:grid;gap:2px;padding:0 6px 8px 56px}
.sub button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 8px;border-radius:8px;color:var(--ink-2);display:flex;gap:8px}
.sub button:hover{background:var(--panel-2)}
.sub button span{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.foot{padding:10px 20px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute);line-height:1.6}

#detail{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));top:calc(190px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;overflow:hidden}
#detail .hd{padding:18px 20px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
#detail .badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:24px}
#detail h2{margin:2px 0 0;font-size:21px;font-weight:900;line-height:1.25;text-wrap:balance}
#detail .x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2);font-size:20px}
#detail .x:hover{background:var(--panel-2)}
#detail .body{overflow:auto;padding:0 20px 18px;min-height:0}
#detail .sum{font-size:14px;line-height:1.7;margin:0 0 10px}
#detail blockquote{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--panel-2);font-size:13.5px;line-height:1.7;color:var(--ink-2)}
#detail blockquote cite{display:block;font-style:normal;font-size:11px;margin-top:4px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips span{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.items{display:grid;gap:6px}
.item{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.item:hover,.item[aria-current="true"]{background:var(--panel-2)}
.item b.n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:11px}
.item strong{font-size:14px;display:block}
.item p{margin:3px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.item small{font-size:11px;color:var(--mute)}

#intro{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:rgba(10,40,24,.28);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#intro .card{max-width:440px;padding:22px 24px 18px}
#intro h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:6px 0 8px}
#intro p{margin:0 0 16px;line-height:1.75;font-size:14px;color:var(--ink-2)}
#intro .acts{display:flex;justify-content:space-between;align-items:center}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:12px;font-weight:900;font-size:14px}
.btn.pri{background:var(--oasis);color:#fff}
.btn.ghost{border:1px solid var(--line);color:var(--ink-2)}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--oasis)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#0f5a32;z-index:30;background:#bfe3f3}
#tourBar{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink);max-width:calc(100vw - 32px)}
#tourT{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tourBar .btn{white-space:nowrap;flex:none}
#tourBar b{white-space:nowrap;font-family:var(--f-mono);font-size:12px;color:var(--mute);font-weight:500}#tourBar .btn{padding:6px 12px;font-size:13px}
#tourBar[hidden]{display:none!important}
#b-drive{position:relative;overflow:visible}
#b-drive.attn{background:#e3f4e8;color:var(--oasis);animation:drvGlow 1.6s ease-out infinite}
@keyframes drvGlow{0%{box-shadow:0 0 0 0 rgba(20,113,60,.6)}70%{box-shadow:0 0 0 14px rgba(20,113,60,0)}100%{box-shadow:0 0 0 0 rgba(20,113,60,0)}}
.go-hint{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;z-index:9}
.go-hint .hand{font-size:30px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:drvTap 1s ease-in-out infinite}
@keyframes drvTap{0%,100%{transform:translateY(8px)}50%{transform:translateY(-2px)}}
.go-hint .bubble{background:var(--oasis);color:#fff;font-size:12.5px;font-weight:900;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(10,60,30,.3);letter-spacing:.02em}
#b-drive:not(.attn) .go-hint{display:none}
#sheetBtn{position:absolute;right:12px;top:12px;padding:7px 14px;font-size:13px;background:var(--panel)}
#dayNight{all:unset;position:fixed;z-index:6;cursor:pointer;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px var(--shadow);color:var(--oasis)}
#dayNight svg{width:22px;height:22px}#dayNight:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
#index{top:calc(72px + env(safe-area-inset-top,0px))!important}
#index.min{bottom:auto!important;height:auto!important}
#index.min header{padding:14px 96px 14px 18px}#index.min h1{font-size:18px;margin:2px 0 0}
#index.min .lead,#index.min .facts,#index.min .tabs,#index.min #search,#index.min #list,#index.min .foot{display:none}

@media (max-width:820px){
 #brand{padding:10px 14px;gap:10px}#brand .mark{font-size:28px}#brand .mark span{font-size:12px;letter-spacing:.2em}#brand .who b{font-size:24px}#brand .who i{display:none}
 #tools{top:calc(86px + env(safe-area-inset-top,0px))}
 .seg button{min-width:36px;padding:5px 6px;font-size:10px}
 #index{top:auto;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;height:46vh;bottom:calc(10px + env(safe-area-inset-bottom,0px));transition:height .3s ease}
 #index.min{height:auto}
 #index{top:auto!important}
 #index.min{top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}
 #index.min header{padding:12px 92px 12px 16px}#index.min h1{font-size:16px}
 #index header{padding:10px 16px 6px}#index h1{font-size:20px;margin:2px 0 4px}#index p.lead,.facts{display:none}
 .seg .tl{display:none}.seg{padding:3px;gap:0}.seg button{min-width:30px;padding:8px 5px}.seg button svg{width:17px;height:17px}
 #brand{max-width:calc(100vw - 92px)}#brand .who em{display:none}#brand .who{padding-left:10px}
 #detail{top:auto;height:56vh;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
 .lbl.town{font-size:16px;padding:3px 10px}
 .go-hint{transform:translateX(-82%);align-items:flex-end}.go-hint .hand{margin-right:14px}
 #tourBar{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));transform:none;max-width:none;padding:8px 8px 8px 14px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="loading">正在把北港、水林、口湖組成一座島…</div>
<div id="stage"></div>
<div id="labels"></div>

<div id="brand" class="float card">
 <div class="mark">科技綠洲<span>洋流港灣</span></div>
 <div class="who"><b>蔡岳儒</b><em>雲林縣議員候選人・第六選區</em><i>BEIGANG · SHUILIN · KOUHU</i></div>
</div>

<div id="tools" class="float">
 <div class="seg card" role="group" aria-label="顯示">
  <button id="b-tags" aria-pressed="true" title="顯示全部政見標示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span class="tl">標示</span></button>
  <button id="b-vil" aria-pressed="false" title="顯示村里界線與名稱"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14"/></svg><span class="tl">村里</span></button>
  <button id="b-road" aria-pressed="true" title="新香路與通勤動線"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18c4-10 12 0 16-10"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="8" r="2"/></svg><span class="tl">動線</span></button>
  <button id="b-pause" aria-pressed="false" title="停止動畫"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5v14M15 5v14"/></svg><span class="tl">靜止</span></button>
  <button id="b-bird" aria-pressed="false" title="從上方俯視"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/></svg><span class="tl">俯視</span></button>
  <button id="b-voice" aria-pressed="false" title="語音導覽（開啟後點政見也會朗讀）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="tl">語音</span></button>
  <button id="b-drive" aria-pressed="false" title="開車導覽：小水滴從嘉義科學園區出發，往北港、水林、口湖前進"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16V11l2-5h10l4 5h2v5"/><path d="M3 16h18"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg><span class="tl">開車</span><span class="go-hint" id="goHint" aria-hidden="true"><span class="hand">👆</span><span class="bubble">點這裡，開車出發！</span></span></button>
  <button id="b-style" aria-pressed="false" title="切換到漫畫描邊風格"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c3 0 4-1.5 4-3.5S9.5 13 11 13s3 1.5 3 3.5-2 3.5-4 3.5H4z"/><path d="M13 12l7-8"/></svg><span class="tl">風格</span></button>
  <button id="b-home" aria-pressed="false" title="回到起點"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9H4z"/></svg><span class="tl">起點</span></button>
 </div>
</div>

<button id="dayNight" type="button" aria-label="切換到夜晚" title="切換到夜晚"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg></button>
<aside id="index" class="float card min" aria-label="政策索引">
 <button id="sheetBtn" class="btn ghost" aria-expanded="false" aria-controls="list">展開</button>
 <header>
  <div class="eyebrow">雲嘉幸福供應鏈</div>
  <h1>科技來了，家鄉要先準備好！</h1>
  <p class="lead">打造科技綠洲，邀請小水滴們，來這個好吃、好玩、好所在，充電再出發！北港、水林、口湖拼成一座島，打造雲嘉幸福供應鏈。</p>
  <div class="facts"><div><b>20</b>分鐘到嘉義科學園區</div><div><b>4</b>大政見主軸</div><div><b>3</b>鄉鎮各有基地</div></div>
 </header>
 <div class="tabs" role="group" aria-label="分類"><button id="tab-p" aria-pressed="true">四大政見</button><button id="tab-t" aria-pressed="false">三鄉鎮基地</button></div>

 if(flyT){const k=Math.min(1,(now-flyT.s)/flyT.d),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(flyT.p0,flyT.p1,e);controls.target.lerpVectors(flyT.t0,flyT.t1,e);if(k>=1)flyT=null;}

  const u=(time*.025)%1,p=incense.getPoint(u),q=incense.getPoint(Math.min(.999,u+.01));procession.position.copy(p);procession.lookAt(q);procession.rotateY(Math.PI/2);

 if(style==='toon'){TOON.forEach(t=>{const m=t.userData.src;t.emissiveIntensity=m.emissiveIntensity;t.color.copy(m.color).offsetHSL(0,.14,.03);});outline.render(scene,camera);}else renderer.render(scene,camera);
 const w=innerWidth,h=innerHeight;LBL.forEach(l=>{if(l.el.hidden)return;v3.copy(l.pos).project(camera);const vis=v3.z<1&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2;l.el.style.visibility=vis?'visible':'hidden';if(vis)l.el.style.transform=`translate(${(v3.x*.5+.5)*w}px,${(-v3.y*.5+.5)*h}px) translate(-50%,-100%)`;});}
